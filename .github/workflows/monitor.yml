name: Monitor network lines

on:
  schedule:
    # Every 5 minutes (GitHub minimum). May drift a bit on free runners.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}      # Allow manual trigger from Actions tab
  push:
    branches: [main]
    paths:
      - "monitor/**"

# Only one monitor run at a time, queue the rest, never parallel
concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write             # to commit status updates back to repo

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ping check
        run: python monitor/check.py

      - name: Commit updated status
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage only the data files we generate
          git add data/status.json data/status.prev.json data/history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No status changes to commit."
            exit 0
          fi
          git commit -m "chore(monitor): update status [skip ci]"
          # Push with retry, since concurrent runs may collide
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $i failed, pulling and retrying..."
            git pull --rebase --autostash
          done
          echo "Push failed after 3 retries"; exit 1
