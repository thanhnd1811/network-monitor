name: Monitor network lines

# Disabled cron: the local probe (running on a school PC inside Vietnam) is the
# primary data source — its accuracy is much higher than pinging from GitHub
# runners abroad. This workflow is kept available for manual fallback only.
on:
  workflow_dispatch: {}      # Manual trigger only
  push:
    branches: [main]
    paths:
      - "monitor/check.py"   # Re-test if script itself changes

# Only one monitor run at a time, queue the rest, never parallel
concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write             # to commit status updates back to repo

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ping check
        run: python monitor/check.py

      - name: Commit updated status
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage only the data files we generate
          git add data/status.json data/status.prev.json data/history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No status changes to commit."
            exit 0
          fi
          git commit -m "chore(monitor): update status [skip ci]"
          # Push with retry, since concurrent runs may collide
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $i failed, pulling and retrying..."
            git pull --rebase --autostash
          done
          echo "Push failed after 3 retries"; exit 1
