<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Giám sát mạng — ĐH Ngoại thương</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 L2 7 v6 c0 5 4 8 10 9 c6-1 10-4 10-9 V7 z"></path>
          <path d="M9 12 l2 2 l4-4"></path>
        </svg>
      </div>
      <div>
        <h1>Giám sát đường mạng</h1>
        <div class="subtitle">Đại học Ngoại thương</div>
      </div>
    </div>
    <div class="header-actions">
      <button id="refresh-btn" class="btn-icon" title="Làm mới ngay">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <section class="summary" id="summary">
      <div class="summary-card pulse">
        <div class="summary-num" id="num-up">—</div>
        <div class="summary-label">Đang hoạt động</div>
      </div>
      <div class="summary-card down" id="card-down">
        <div class="summary-num" id="num-down">—</div>
        <div class="summary-label">Đang mất kết nối</div>
      </div>
      <div class="summary-card">
        <div class="summary-num" id="num-total">—</div>
        <div class="summary-label">Tổng số đường</div>
      </div>
    </section>

    <section class="meta" id="meta">
      <span id="last-updated">Đang tải dữ liệu lần đầu…</span>
      <span class="dot-sep">·</span>
      <span id="next-refresh">Tự làm mới mỗi 30 giây</span>
    </section>

    <div id="locations-container"></div>

    <section class="history-section">
      <h2>Lịch sử sự cố gần đây</h2>
      <div id="history-list">
        <div class="empty">Chưa có dữ liệu lịch sử.</div>
      </div>
    </section>
  </main>

  <footer>
    <div>Dữ liệu cập nhật từ GitHub Actions, kiểm tra mỗi 5 phút.</div>
    <div class="muted">Phiên bản 1.0</div>
  </footer>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
